<!DOCTYPE html>
<html>
<head><title>Contact</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <nav>
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none">🏨 Ethio Hotel</a></div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  <form id="contactForm">
    <h2>Contact Us</h2>
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <input type="text" id="subject" placeholder="Subject" required>
    <textarea id="message" rows="5" placeholder="Message" required></textarea>
    <button class="btn" style="width:100%">Send Message</button>
    <p id="msg" style="text-align:center;margin-top:1rem"></p>
  </form>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      try {
        await apiFetch('/contact', {
          method: 'POST',
          body: JSON.stringify({
            name: name.value, email: email.value,
            subject: subject.value, message: message.value
          })
        });
        msg.style.color = 'green';
        msg.textContent = '✅ Message sent! We will contact you soon.';
        e.target.reset();
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
