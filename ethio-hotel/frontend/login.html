<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Ethio Hotel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="logo">
      <a href="index.html" style="color:inherit;text-decoration:none">&#127968; Ethio Hotel</a>
    </div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="signup.html">Sign Up</a></li>
    </ul>
  </nav>

  <form id="loginForm">
    <h2>Welcome Back</h2>

    <input type="email" id="email" name="email" placeholder="Email" required>
    <input type="password" id="password" name="password" placeholder="Password" required>

    <button class="btn" type="submit" style="width:100%">Login</button>

    <p id="msg" style="color:red;text-align:center;margin-top:1rem"></p>

    <div class="social-login">
      <a href="/api/auth/google" class="google-btn">Google</a>
      <a href="/api/auth/facebook" class="facebook-btn">Facebook</a>
    </div>

    <p style="text-align:center;margin-top:1rem">
      No account? <a href="signup.html">Sign up</a>
    </p>
  </form>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.style.color = 'red';
      msg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email) { msg.textContent = 'Please enter your email'; return; }
      if (!password) { msg.textContent = 'Please enter your password'; return; }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        window.location.href = 'dashboard.html';
      } catch (err) {
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
