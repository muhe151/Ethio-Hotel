<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms — Ethio Hotel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none">🏨 Ethio Hotel</a></div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="rooms.html">Rooms</a></li>
      <li><a href="profile.html">Our Hotel</a></li>
      <li><a href="about.html">Dining Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2 style="margin-bottom:.5rem">Our Rooms</h2>
    <p style="color:#888;margin-bottom:1rem">Live availability — updated in real time</p>
    <div id="summaryBar" style="display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap"></div>
    <div class="grid" id="roomsGrid"><p>Loading rooms...</p></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const comfortClass = (level) => ({
      Basic: 'badge-basic', Comfort: 'badge-comfort',
      Premium: 'badge-premium', Luxury: 'badge-luxury'
    }[level] || 'badge-basic');

    const statusBadge = (room) => {
      if (room.remainingRooms === 0) return '<span class="badge badge-booked">Fully Booked</span>';
      if (room.remainingRooms <= 2) return `<span class="badge badge-limited">Only ${room.remainingRooms} left</span>`;
      return '<span class="badge badge-available">Available</span>';
    };

    const occupancyBar = (room) => {
      const total = room.totalRooms || 1;
      const booked = room.currentlyBooked || 0;
      const pct = Math.round((booked / total) * 100);
      const color = pct >= 100 ? '#da121a' : pct >= 75 ? '#b8860b' : '#078930';
      return `
        <div class="occupancy-bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="occupancy-text">
          <span>${booked} / ${total} booked</span>
          <span>${room.totalRooms - booked} available</span>
        </div>`;
    };

    (async () => {
      const grid = document.getElementById('roomsGrid');
      const summary = document.getElementById('summaryBar');
      try {
        const rooms = await apiFetch('/rooms');
        if (!rooms || rooms.length === 0) {
          grid.innerHTML = '<p style="padding:2rem">No rooms available.</p>';
          return;
        }
        const totalRooms = rooms.reduce((s, r) => s + (r.totalRooms || 0), 0);
        const totalBooked = rooms.reduce((s, r) => s + (r.currentlyBooked || 0), 0);
        const availableNow = totalRooms - totalBooked;

        summary.innerHTML = `
          <div class="badge badge-available" style="padding:.6rem 1rem">${availableNow} available now</div>
          <div class="badge badge-booked" style="padding:.6rem 1rem">${totalBooked} currently booked</div>
          <div class="badge badge-limited" style="padding:.6rem 1rem">${totalRooms} total rooms</div>`;

        grid.innerHTML = rooms.map(r => {
          const img = (r.images && r.images[0]) || 'https://via.placeholder.com/400x220?text=' + encodeURIComponent(r.name);
          const isBooked = r.remainingRooms === 0;
          return `
            <div class="room-card">
              <div class="img-wrap">
                <img src="${img}" alt="${r.name}">
                <div class="status-overlay">${statusBadge(r)}</div>
              </div>
              <div class="body">
                <div style="display:flex;justify-content:space-between;align-items:start;gap:.5rem">
                  <h3>${r.name}</h3>
                  <span class="badge ${comfortClass(r.comfortLevel)}">${r.comfortLevel || 'Comfort'}</span>
                </div>
                <div class="meta">${r.type} · Sleeps ${r.capacity} · ${r.roomSize || ''}</div>
                <div class="highlights">${(r.highlights || []).slice(0,3).map(h => `<span>${h}</span>`).join('')}</div>
                <p class="desc">${r.description || ''}</p>
                ${occupancyBar(r)}
                <div class="footer">
                  <div class="price">${r.pricePerNight.toLocaleString()} ETB</div>
                  <a href="room-detail.html?id=${r._id}" class="btn ${isBooked ? 'btn-ghost' : ''}"
                     style="padding:.55rem 1.1rem;font-size:.9rem;${isBooked ? 'opacity:.5;pointer-events:none' : ''}">
                    ${isBooked ? 'Booked' : 'View →'}
                  </a>
                </div>
              </div>
            </div>`;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<p style="color:red;padding:2rem">Failed: ${err.message}</p>`;
      }
    })();
  </script>
</body>
</html>
